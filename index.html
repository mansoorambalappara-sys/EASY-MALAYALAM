<html lang="ml"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Anek Malayalam','Noto Sans Malayalam','Manjari','Kartika',sans-serif;min-height:100vh;overflow-x:hidden}
header{background:linear-gradient(90deg,var(--a),var(--d));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 5px 0 #0003}
header h1{margin:0;font-size:24px;flex:1;text-shadow:0 3px 0 #0004}
button{font-family:inherit;cursor:pointer;border:0}
.back{background:#fff3;color:#fff;border-radius:20px;padding:6px 14px;font-size:16px}
main{max-width:760px;margin:0 auto;padding:16px;position:relative;z-index:1}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky span{position:absolute;bottom:-60px;font-size:34px;opacity:.7;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;perspective:900px}
.tile{background:var(--c);color:#fff;border-radius:22px;padding:20px 10px;font-size:20px;font-weight:800;box-shadow:0 8px 0 #0004,0 14px 18px #0003;text-align:center;transition:transform .15s;text-shadow:0 2px 0 #0004;transform-style:preserve-3d}
.tile:active{box-shadow:0 2px 0 #0004}
.tile:nth-child(4n+1){background:var(--a)}.tile:nth-child(4n+2){background:var(--b)}.tile:nth-child(4n+3){background:var(--d)}
.em{display:inline-block;filter:drop-shadow(0 8px 4px #0004)}
.tile .em{display:block;font-size:48px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotateY(-30deg)}50%{transform:translateY(-10px) rotateY(30deg) rotate(4deg)}}
.hero{text-align:center;font-size:21px;margin:6px 0 18px;font-weight:700}

.lt{background:var(--card);border:3px solid var(--b);border-radius:18px;font-size:38px;padding:10px 0;color:var(--ink);font-weight:800;box-shadow:0 5px 0 var(--b);transition:transform .15s}
.lt small{display:block;font-size:13px;font-weight:400}
.big{text-align:center;font-size:96px;font-weight:800;color:var(--a);margin:0;text-shadow:0 4px 0 #0003,0 9px 0 #0001;animation:flip .7s}
@keyframes flip{from{transform:rotateY(180deg) scale(.3)}to{transform:rotateY(0) scale(1)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{background:var(--b);color:#fff;border-radius:16px;padding:14px;font-size:24px;font-weight:700;box-shadow:0 5px 0 #0003}
.opt.ok{background:var(--ok);animation:jump .5s}.opt.bad{background:var(--bad);animation:shake .4s}
@keyframes jump{40%{transform:translateY(-14px) scale(1.06)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.q{font-size:24px;text-align:center;font-weight:700}
.q .em{font-size:70px;display:block;animation:bob 3s ease-in-out infinite}
.poem{font-size:22px;line-height:1.9;text-align:center}
.ln{padding:2px 10px;border-radius:12px;transition:.25s;cursor:pointer}
.ln.hi{background:var(--hi);transform:scale(1.07);font-weight:800}
.stage{position:relative;height:150px;overflow:hidden;border-radius:18px;background:linear-gradient(#81d4fa,#e1f5fe);margin:10px 0;display:flex;align-items:center;justify-content:center;perspective:500px;box-shadow:inset 0 -12px 0 #66bb6a}
.actor{font-size:76px;animation:enter .8s ease-out,sway 2s .8s ease-in-out infinite;filter:drop-shadow(0 10px 5px #0004)}
@keyframes enter{from{transform:translateY(80px) rotateY(180deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotateY(-20deg) translateY(0)}50%{transform:rotateY(20deg) translateY(-12px) rotate(5deg)}}
.fx{position:absolute;top:-30px;font-size:24px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(190px) rotate(120deg)}}
.panel{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 5px 0 #0002;animation:pop .4s;transition:.3s;cursor:pointer}

.panel .em{font-size:54px}.panel p{margin:0;font-size:20px;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.chip{background:var(--card);border:3px solid var(--d);border-radius:14px;padding:8px 16px;font-size:24px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--d);color:#fff}
.go{background:var(--a);color:#fff;border-radius:18px;padding:12px 22px;font-size:20px;font-weight:700;display:block;margin:14px auto;box-shadow:0 6px 0 #0004}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #0004}
.note{text-align:center;font-size:14px;opacity:.75}
.stars{font-size:44px;text-align:center}
.stars span{display:inline-block;animation:flip .8s backwards}
.bar{height:10px;background:#0002;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:30;border-radius:22px 22px 0 0}
.bst{position:fixed;left:50%;top:45%;font-size:30px;z-index:20;pointer-events:none;animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(360deg) scale(1.4);opacity:0}}
</style></head><body>

function recToggle(){if(MR&&MR.state=='recording'){MR.stop();return}var m=$('rmsg');if(!navigator.mediaDevices||!window.MediaRecorder){m.textContent='ഈ ബ്രൗസറിൽ റെക്കോർഡിംഗ് ഇല്ല. Chrome-ൽ തുറക്കൂ.';return}navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){ch=[];var t=_R[cur],i=cur;MR=new MediaRecorder(s);MR.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};MR.onstop=function(){s.getTracks().forEach(function(x){x.stop()});var b=new Blob(ch,{type:MR.mimeType||'audio/webm'});putRec(t,b,function(){if($('rs'+i))$('rs'+i).textContent='✅';$('rbtn').textContent='⏺ വീണ്ടും';$('rmsg').textContent='സേവ് ചെയ്തു ✅';playRec(b)})};MR.start();$('rbtn').textContent='⏹ നിർത്തൂ';m.textContent='🔴 റെക്കോർഡ് ചെയ്യുന്നു…'}).catch(function(){m.textContent='മൈക്ക് അനുമതി കിട്ടിയില്ല. ലിങ്ക് Chrome-ൽ നേരിട്ട് തുറന്ന് Allow കൊടുക്കൂ.'})}
function testVoice(){tune([523,659,784]);var m=$('vs');if(typeof speechSynthesis=='undefined'||!window.SpeechSynthesisUtterance){m.textContent='ഈ ബ്രൗസറിൽ സംസാരശബ്ദം ഇല്ല. Chrome-ൽ തുറക്കൂ.';return}pickVoice();m.textContent=VO?'മലയാളം ശബ്ദം കിട്ടി ✅ ('+VO.name+')':'മലയാളം ശബ്ദം ഫോണിൽ ഇല്ല ❌ — Settings → System → Languages → Text-to-speech → Google Speech Services → Install voice data → Malayalam';say('നമസ്കാരം കൂട്ടുകാരെ')}
function utter(t,end){var u=new SpeechSynthesisUtterance(t);u.lang='ml-IN';u.rate=.8;u.volume=1;if(!VO)pickVoice();if(VO)u.voice=VO;keep.push(u);if(keep.length>20)keep.shift();if(end){u.onend=end;u.onerror=end}return u}
function say(t){stop();var me=tok;setTimeout(function(){speakText(t,null,me)},150)}
// വരി വരിയായി വായിക്കുന്നു; ഓരോ വരിക്കും onLine(j) വിളിക്കും
function readLines(lines,onLine,onEnd){stop();var me=tok,k=0;function next(){if(me!=tok)return;if(k>=lines.length){onEnd&&onEnd();return}var j=k++,fin=false,t;onLine(j);function d(){if(fin)return;fin=true;clearTimeout(t);setTimeout(next,250)}t=setTimeout(d,lines[j].length*300+9000);speakText(lines[j],d,me)}setTimeout(next,150)}
function star(n){st+=n;$('sc').textContent='⭐ '+st}
function burst(ch){tune([523,659,784,1047]);for(var i=0;i<14;i++){var s=document.createElement('span');s.className='bst';s.textContent=ch[i%ch.length];s.style.setProperty('--x',(Math.random()*320-160)+'px');s.style.setProperty('--y',(-Math.random()*260-30)+'px');document.body.appendChild(s);setTimeout(function(e){e.remove()},1200,s)}}
function back(){stop();stack.pop();var f=stack.pop();f?f():home()}
function go(f){stop();stack.push(f);$('bk').hidden=false;f()}
function home(){stop();stack=[];lv=null;$('bk').hidden=true;app.innerHTML='<p class="hero">🌟 നിങ്ങളുടെ ക്ലാസ് തിരഞ്ഞെടുക്കൂ 🌟</p><div class="grid">'+Object.keys(LV).map(function(k){return '<button class="tile" onclick="pick(\''+k+'\')"><span class="em">'+LV[k][1]+'</span>'+LV[k][0]+'</button>'}).join('')+'</div><button class="go" onclick="testVoice()">🔊 ശബ്ദം പരിശോധിക്കൂ</button><p class="note" id="vs"></p><button class="go" onclick="go(recPage)">🎙 എന്റെ ശബ്ദം റെക്കോർഡ് ചെയ്യൂ</button>'}
function pick(k){lv=k;go(menu)}
function menu(){app.innerHTML='<p class="hero">'+LV[lv][1]+' '+LV[lv][0]+'</p><div class="grid">'+LV[lv][2].map(function(m){return '<button class="tile" onclick="open_(\''+m[2]+'\')"><span class="em">'+m[1]+'</span>'+m[0]+'</button>'}).join('')+'</div>'}
function open_(k){var m={vow:function(){letters(V,'സ്വരാക്ഷരങ്ങൾ')},con:function(){letters(C,'വ്യഞ്ജനങ്ങൾ')},sign:signs,poem:poems,story:stories,pic:function(){quiz(picQ(lv=='pre'?V:C))},qsign:function(){quiz(signQ())},qop:function(){quiz(opQ())},qpv:function(){quiz(pvQ())}};go(m[k])}
function letters(L,t){app.innerHTML='<p class="hero">'+t+' – തൊട്ടാൽ കേൾക്കാം 🔊</p><div id="bg"></div><div class="letters">'+L.map(function(x,i){return '<button class="lt" onclick="show('+i+')">'+x[0]+'<small>'+x[2]+'</small></button>'}).join('')+'</div>';window._L=L}
function show(i){var x=window._L[i];$('bg').innerHTML='<div class="card"><p class="big">'+x[0]+'</p><p class="hero"><span class="em" style="font-size:60px;animation:bob 2s infinite">'+x[2]+'</span><br>'+x[1]+'</p></div>';say(x[0]+', '+x[1]);burst([x[2],'✨']);star(1)}
var bs='ക';
function signs(){app.innerHTML='<p class="hero">അക്ഷരം തിരഞ്ഞെടുക്കൂ, ചിഹ്നം തൊടൂ 👆</p><div class="row">'+'കമപതനരലവ'.split('').map(function(c){return '<button class="chip'+(c==bs?' on':'')+'" onclick="bs=\''+c+'\';signs()">'+c+'</button>'}).join('')+'</div><div class="letters">'+SG.map(function(s){return '<button class="lt" onclick="say(\''+bs+s[0]+'\');burst([\'✨\',\'⭐\']);star(1)">'+bs+s[0]+'<small>'+s[1]+'</small></button>'}).join('')+'</div>'}
function picQ(L){return sh(L).slice(0,6).map(function(x){return {q:'<span class="em">'+x[2]+'</span>'+x[1]+' – ആദ്യ അക്ഷരം?',a:x[0],o:sh(L.map(function(y){return y[0]}).filter(function(y,i,a){return a.indexOf(y)==i&&y!=x[0]})).slice(0,2),s:x[1]}})}
function signQ(){return Array.from({length:6},function(){var c=CONS[Math.floor(Math.random()*CONS.length)],g=sh(SG).slice(0,3),w=g[0];return {q:c+' + '+w[0]+' = ?',a:c+w[0],o:[c+g[1][0],c+g[2][0]]}})}
function opQ(){return sh(OP).slice(0,6).map(function(p){var r=Math.random()<.5,w=r?p[0]:p[1],a=r?p[1]:p[0];return {q:'<span class="em">↔️</span>"'+w+'" ന്റെ വിപരീതം?',a:a,o:sh(OP.map(function(x){return x[0]}).concat(OP.map(function(x){return x[1]})).filter(function(x){return x!=a&&x!=w})).slice(0,2)}})}
function pvQ(){return sh(PV).map(function(p){return {q:'<span class="em">💡</span>'+p[0],a:p[1],o:p[2]}})}
function quiz(Q,done){var i=0,sc=0;function r(){if(i>=Q.length){var s=sc>=Q.length-1?3:sc>=Q.length/2?2:1;app.innerHTML='<div class="card"><p class="hero">🎉 കഴിഞ്ഞു! '+sc+'/'+Q.length+'</p><div class="stars">'+'<span>⭐</span>'.repeat(s)+'</div></div><button class="go" onclick="back()">⬅ മെനു</button>';burst(['🎉','⭐','🎈','✨']);star(s);if(done)done();return}
var q=Q[i],o=sh([q.a].concat(q.o));app.innerHTML='<div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="card"><div class="q">'+q.q+'</div><div class="opts">'+o.map(function(x){return '<button class="opt">'+x+'</button>'}).join('')+'</div></div>';
if(q.s)say(q.s);
Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){var ok=b.textContent==q.a;b.className='opt '+(ok?'ok':'bad');if(!ok)beep(180,.35,'sawtooth');say(b.textContent);if(ok){sc++;burst(['⭐','🎉','✨'])}Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(x){x.onclick=null;if(x.textContent==q.a)x.className='opt ok'});setTimeout(function(){i++;r()},1100)}})}
r()}
function poems(){app.innerHTML='<p class="note">🔊 ശബ്ദം കേൾക്കുന്നില്ലെങ്കിൽ ഫോൺ Settings → Text-to-speech ൽ മലയാളം ശബ്ദം ഇൻസ്റ്റാൾ ചെയ്യുക</p>'+POEMS.map(function(p,i){return '<div class="card"><h2 style="text-align:center">🎵 '+p[0]+'</h2><div class="stage" id="sg'+i+'"><span class="actor">'+p[2][0]+'</span></div><div class="poem">'+p[1].split('\n').map(function(l,j){return '<div class="ln" id="p'+i+'_'+j+'" onclick="line('+i+','+j+')">'+l+'</div>'}).join('')+'</div><button class="go" onclick="playPoem('+i+')">🔊 പാടാം</button></div>'}).join('')}
function scene(i,j){var p=POEMS[i],sg=$('sg'+i);if(!sg)return;Array.prototype.forEach.call(document.querySelectorAll('.ln.hi'),function(x){x.classList.remove('hi')});$('p'+i+'_'+j).classList.add('hi');sg.innerHTML='<span class="actor">'+p[2][j]+'</span>';for(var n=0;n<9;n++){var f=document.createElement('span');f.className='fx';f.textContent=p[3];f.style.left=(Math.random()*90)+'%';f.style.animationDelay=(Math.random()*1.2)+'s';sg.appendChild(f)}}
function line(i,j){stop();scene(i,j);var l=POEMS[i][1].split('\n')[j];setTimeout(function(){speakText(l,null,tok)},150)}
function playPoem(i){var L=POEMS[i][1].split('\n');readLines(L,function(j){scene(i,j)},function(){burst(['🎉','⭐','🎶']);star(2)})}
function stories(){var n=(lv=='pre'||lv=='c1')?2:3;app.innerHTML='<div class="grid">'+ST.slice(0,n).map(function(s,i){return '<button class="tile" onclick="story('+i+')"><span class="em">'+s[1][0][0]+'</span>'+s[0]+'</button>'}).join('')+'</div>'}
function story(i){go(function(){var s=ST[i];app.innerHTML='<h2 class="hero">'+s[0]+'</h2><button class="go" onclick="playStory('+i+')">▶ കഥ കേൾക്കാം</button>'+s[1].map(function(p,j){return '<div class="panel" id="s'+j+'" onclick="say(ST['+i+'][1]['+j+'][1])"><span class="em">'+p[0]+'</span><p>'+p[1]+' 🔊</p></div>'}).join('')+((lv=='pre'||lv=='c1')?'':'<button class="go" onclick="sq('+i+')">❓ ചോദ്യം</button>')});}
function playStory(i){readLines(ST[i][1].map(function(p){return p[1]}),function(j){Array.prototype.forEach.call(document.querySelectorAll('.panel.hi'),function(x){x.classList.remove('hi')});var e=$('s'+j);e.classList.add('hi');e.scrollIntoView({behavior:'smooth',block:'center'})},function(){burst(['🎉','⭐','📖']);star(2)})}
function sq(i){var q=ST[i][2];go(function(){quiz([{q:'<span class="em">❓</span>'+q[0],a:q[1],o:q[2]}])})}
document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('button'))beep(520,.05)});
// 3D ടിൽറ്റ്
function tl(e){return e.target.closest&&e.target.closest('.tile,.lt')}
document.addEventListener('pointermove',function(e){var t=tl(e);if(!t)return;var r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform='perspective(500px) rotateX('+(-y*24)+'deg) rotateY('+(x*24)+'deg) scale(1.05)'});
document.addEventListener('pointerout',function(e){var t=tl(e);if(t)t.style.transform=''});
// പശ്ചാത്തല കാർട്ടൂൺ
(function(){var E='☁️🎈🦋⭐🐥🌈🎈🌸'.match(/\p{Extended_Pictographic}\uFE0F?/gu),s=$('sky');for(var i=0;i<12;i++){var e=document.createElement('span');e.textContent=E[i%E.length];e.style.left=(i*8.5)+'%';e.style.animationDuration=(14+Math.random()*14)+'s';e.style.animationDelay=(-Math.random()*20)+'s';s.appendChild(e)}})();
home();
</script></body></html>
